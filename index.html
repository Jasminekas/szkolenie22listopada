<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moje kompetencje AI — TAK/NIE</title><style>body{font:16px system-ui,sans-serif;background:#f5f7fb;color:#17243a;margin:0}main{max-width:760px;margin:32px auto;padding:24px;background:white;border-radius:16px;box-shadow:0 4px 22px #15243a12}h1{font-size:1.7rem}h2{margin-top:32px;font-size:1.15rem}fieldset{border:0;border-bottom:1px solid #e3e7ef;padding:14px 0;margin:0;display:flex;justify-content:space-between;gap:16px;align-items:center}legend{float:left;width:65%;padding:0}label{white-space:nowrap;margin-left:12px;cursor:pointer}input{accent-color:#2356bd}button{padding:12px 18px;border:0;border-radius:9px;background:#2356bd;color:white;font-weight:700;cursor:pointer}button.secondary{background:#e8eef9;color:#193b7b}#result{margin-top:24px;padding:18px;background:#eef4ff;border-radius:12px}progress{width:100%;height:14px}small{color:#516078}@media(max-width:550px){main{margin:0;padding:18px;border-radius:0}fieldset{display:block}legend{float:none;width:auto;margin-bottom:12px}label{display:inline-block;margin-left:0;margin-right:20px}}@media print{body{background:white}main{box-shadow:none;margin:0}button{display:none}}</style></head><body><main><h1>Moje kompetencje AI</h1><p><strong>Samoocena po warsztatach</strong> — zaznacz TAK lub NIE. To nie jest egzamin.</p><p><small>Postęp: <span id="progressText">0/0</span></small><progress id="progress" max="1" value="0"></progress></p><form id="form"><div id="questions"></div><p><button type="button" id="show">Zobacz wynik</button> <button type="button" class="secondary" id="print">Zapisz jako PDF</button> <button type="reset" class="secondary">Wyczyść</button></p></form><section id="result" hidden aria-live="polite"></section></main><script>const sections=[['Czy wiem, czym jest…?',['LLM / LM','Token','Halucynacja AI','Claude i Gemini','Prompt i metaprompt','Wtyczka / integracja z ChatGPT','Łańcuch myśli','Artefakt','Kotwica logiczna']],['Czy potrafię…?',['Utworzyć folder i przesłać plik na Dysk Google','Utworzyć projekt w Canva','Utworzyć prezentację w Gamma','Napisać prompt z czterema częściami','Wygenerować prompt z metaprompta','Wygenerować edytowalny dokument za pomocą AI','Utworzyć grafikę w Canva z pomocą ChatGPT','Znaleźć i poprawić błędy w pliku','Przygotować metaprompt z opisem persony','Dodać źródła do NotebookLM i sprawdzić cytowania']],['Czy wiem, jak…?',['Korzystać z biblioteki promptów','Odnaleźć wcześniejszą rozmowę z AI','Ograniczać halucynacje i sprawdzać źródła','Chronić dane osobowe i poufne w pracy z AI']],['Czy potrafię korzystać z…?',['ChatGPT','Gemini','Claude','Gamma','Canva','NotebookLM']]];const root=document.getElementById('questions');let n=0;sections.forEach(([title,items])=>{const h=document.createElement('h2');h.textContent=title;root.append(h);items.forEach(item=>{const fs=document.createElement('fieldset'),lg=document.createElement('legend');lg.textContent=item;fs.append(lg);['Tak','Nie'].forEach((v)=>{const l=document.createElement('label'),i=document.createElement('input');i.type='radio';i.name='q'+n;i.value=v;l.append(i,' '+v);fs.append(l)});root.append(fs);n++})});const form=document.getElementById('form'),res=document.getElementById('result');function update(){const count=new Set([...form.querySelectorAll('input:checked')].map(x=>x.name)).size;document.getElementById('progressText').textContent=count+'/'+n;document.getElementById('progress').max=n;document.getElementById('progress').value=count}form.addEventListener('change',update);form.addEventListener('reset',()=>{res.hidden=true;setTimeout(update,0)});document.getElementById('show').onclick=()=>{const yes=form.querySelectorAll('input[value="Tak"]:checked').length,answered=form.querySelectorAll('input:checked').length;res.hidden=false;res.innerHTML='<h2>Twój wynik</h2><p><strong>'+yes+' odpowiedzi TAK</strong> na '+answered+' udzielonych ('+n+' pytań łącznie).</p><p>Wróć do odpowiedzi NIE — to Twoja lista zagadnień do przećwiczenia. Wynik jest samooceną, nie testem wiedzy.</p>';res.scrollIntoView({behavior:'smooth',block:'nearest'})};document.getElementById('print').onclick=()=>window.print();update();</script></body></html>
